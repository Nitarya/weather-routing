services:
  - type: web
    name: spotter-route
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: APP_USERNAME
        value: route
      - key: APP_PASSWORD
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
