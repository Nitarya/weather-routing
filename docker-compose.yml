name: route-weather

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: route-weather:latest
    container_name: route-weather
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      APP_USERNAME: "${APP_USERNAME:-route}"
      APP_PASSWORD: "${APP_PASSWORD:?Set APP_PASSWORD in .env}"
    ports:
      # Loopback only. Nginx on the host proxies ports 80/443 to this port.
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
